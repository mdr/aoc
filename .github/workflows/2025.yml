name: 2025 (Scala)

on:
  push:
    branches: [main]
    paths: ["2025/**", ".github/workflows/2025.yml", ".github/workflows/sbt.yml"]
  pull_request:
    paths: ["2025/**", ".github/workflows/2025.yml", ".github/workflows/sbt.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbt:
    uses: ./.github/workflows/sbt.yml
    with:
      directory: 2025
      command: testFull
