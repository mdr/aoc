name: 2024 (Lean)

on:
  push:
    paths: ["2024/**", ".github/workflows/2024.yml"]
  pull_request:
    paths: ["2024/**", ".github/workflows/2024.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: 2024
